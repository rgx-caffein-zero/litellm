# HTTPS 終端と LiteLLM へのリバースプロキシ
#
# Claude Desktop / Cowork の要件（docs/requirements.md の C4）:
#   - ストリーミング応答（SSE）をバッファリングせず、そのまま流す
#   - 会話の圧縮など長い応答で切断しないよう、タイムアウトを 10 分より長くする
#
# アクセス制御:
#   - 推論 API とヘルスチェックは、どの PC からでも使える（LiteLLM がキーで認証する）
#   - それ以外（管理 UI、管理 API、プロバイダーへのパススルーなど）は、
#     管理者の端末（.env の ADMIN_ALLOW_CIDRS）からだけ使える。
#     許可する IP 範囲は、起動時に nginx/entrypoint/40-admin-allow.sh が
#     /etc/nginx/admin-allow.conf に生成する
#   - 使わない機能（Moyai、Lens、Auto Router）は、管理者の端末からも 404 にする
#     （docs/requirements.md の R7、docs/adr/0004）
#   - 公開するパスは、正規化（%XX のデコード、.. や // の解決）が不要なものだけを受け付ける。
#     nginx は正規化後のパスで location を選ぶが、proxy_pass は受け取ったままのパスを
#     LiteLLM に渡すため、正規化が必要なパスを許すと IP 制限を回避されるおそれがある
#     （例: /bedrock/...%2F..%2Fv1/messages が推論 API と判定され、パススルーに届く）

# クエリ文字列を除いた、クライアントが送ったままのパス
map $request_uri $raw_request_path {
    "~^(?<path>[^?]*)" $path;
}

upstream litellm {
    server litellm:4000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 画像や PDF を含むリクエストを受け付けるため大きめにする
    client_max_body_size 100m;

    # 以下のプロキシ設定は、各 location に引き継がれる
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx が唯一の入口なので、クライアントが送った X-Forwarded-For は引き継がずに上書きする
    # （LiteLLM 側で接続元 IP を使う設定をしたときに、偽装された値を信用しないため）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    proxy_connect_timeout 30s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
    send_timeout          900s;

    # 推論 API（OpenAI 互換と Anthropic 互換。/v1 なしの形も LiteLLM は受け付ける）
    # 利用者に公開するエンドポイントを増やす場合は、ここに追加する。
    location ~ ^/(v1/)?(messages|chat/completions|completions|responses|embeddings|models|images|audio|moderations|rerank)(/|$) {
        if ($raw_request_path != $uri) {
            return 400;
        }
        proxy_pass http://litellm;
    }

    location = /health/liveliness {
        if ($raw_request_path != $uri) {
            return 400;
        }
        proxy_pass http://litellm;
    }

    # 使わない機能は、管理者の端末からも使えないようにする。LiteLLM 側に無効化の設定がないため。
    #   - Moyai: 外部サービスとの接続（/moyai/connect/exchange は LiteLLM が認証なしで受け付ける）
    #   - Lens: 外部サービスへのトレース送信と評価
    #   - Auto Router: リクエストの難易度でモデルを振り分ける機能
    # 判定は正規化後のパスで行うので、%XX や .. を使っても回避できない
    location ~ ^/(v1/)?(moyai|lens|auto_router)(/|$) {
        return 404;
    }

    location ~ ^/public/(autorouter_presets|complexity_router)(/|$) {
        return 404;
    }

    location ~ ^/ui/(moyai|lens)(/|$) {
        return 404;
    }

    # 上記以外はすべて管理者の端末からだけ許可する
    location / {
        include /etc/nginx/admin-allow.conf;
        deny    all;
        proxy_pass http://litellm;
    }
}
