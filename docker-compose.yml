# Claude Cowork 連携対応 LiteLLM
#
# 構成: nginx（HTTPS 終端）→ LiteLLM → PostgreSQL
# 外部に公開するのは nginx の 443 番ポートだけ。LiteLLM と PostgreSQL は
# compose 内部のネットワークからのみ到達できる。
#
# 起動前に必要なもの（手順は docs/setup.md）:
#   - .env（.env.example をコピーして値を設定）
#   - certs/server.crt と certs/server.key（scripts/certs/ のスクリプトで作成）
#
# イメージはタグと digest の両方で固定する（タグの付け替えで中身が変わるのを防ぐ）。
# 更新手順は docs/operations.md の「LiteLLM を更新する」。
#
# ${VAR:?...} の必須変数を追加・変更したら、scripts/lint.sh のダミー値も合わせる。

# コンテナのログ（docker compose logs）が際限なく増えないよう、サイズと世代数を制限する
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.30.1-alpine@sha256:c819f83c54b0361f5557601bf5eb4943d09360e7a7fdf426afc466570f45874d
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      # 管理 UI・管理 API に接続できる管理者端末の IP 範囲（空白区切り。任意）。
      # nginx/entrypoint/40-admin-allow.sh が起動時に allow 行へ変換する。未設定なら制限しない
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint/40-admin-allow.sh:/docker-entrypoint.d/40-admin-allow.sh:ro
      # 証明書がないまま起動すると、Docker が同名の空ディレクトリを root で作り、
      # nginx が証明書を読めずに再起動を繰り返す。create_host_path: false で起動時にエラーにする
      - type: bind
        source: ./certs/server.crt
        target: /etc/nginx/certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server.key
        target: /etc/nginx/certs/server.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    logging: *default-logging
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?.env に LITELLM_MASTER_KEY を設定してください}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?.env に LITELLM_SALT_KEY を設定してください}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}@db:5432/litellm
      # 管理 UI からモデルと認証情報を追加できるようにする（docs/adr/0001 を参照）
      STORE_MODEL_IN_DB: "True"
      # Bedrock の認証情報。config.yaml のモデルと、管理 UI で追加した Bedrock モデルの両方が使う。
      # 任意（未設定でも起動する。その場合、Bedrock のモデルへのリクエストは 500 エラー（Unable to locate credentials）になる）
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.8-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
