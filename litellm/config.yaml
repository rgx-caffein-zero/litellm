# LiteLLM プロキシの設定
#
# ここには Claude Desktop / Cowork が使う Claude モデルだけを定義する。
# それ以外のモデル（Azure OpenAI、その他の Bedrock モデル）は管理 UI から追加する
# （STORE_MODEL_IN_DB。docs/operations.md を参照）。
#
# 機密情報はこのファイルに書かない。os.environ/<変数名> でコンテナの環境変数を参照する。
# 環境変数は .env の値を docker-compose.yml の environment で渡している
# （.env に追加しただけではコンテナに届かない）。

model_list:
  # Bedrock の Claude は Invoke 経路（bedrock/invoke/）を使う。Converse 経路では
  # Claude Code / Cowork のプロンプトキャッシュが効かなくなるため（docs/adr/0003）。
  # model_name には Claude API のモデル ID をそのまま使う。Claude Desktop が
  # モデルの世代と機能（コンテキスト長など）を名前から判定するため。

  # Auto モードの安全性分類器が既定で呼ぶモデル。名前を変えたり削除したりしないこと。
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-sonnet-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-sonnet-5-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-opus-5-5
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-opus-5-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-haiku-5-5
    litellm_params:
      model: bedrock/invoke/us.anthropic.claude-haiku-5-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # 管理 UI からのモデル追加（store_model_in_db）は、docker-compose.yml の
  # 環境変数 STORE_MODEL_IN_DB で有効にしている。
  # プロンプトと応答の本文は DB に保存しない（既定値。方針を明示するために記載）。
  # 利用ログ（日時・モデル・トークン数・金額）は保存され、予算の集計に使われる。
  store_prompts_in_spend_logs: false
